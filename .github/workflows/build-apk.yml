name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ['phase-*', main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.1
      - name: Re-record screenshots (only when the commit message contains [record snapshots])
        if: contains(github.event.head_commit.message, '[record snapshots]')
        run: |
          gradle :core:design:recordRoborazziDebug --no-daemon
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add core/design/src/test/snapshots
          git diff --cached --quiet || git commit -m "Re-record screenshots"
          git push origin HEAD:${{ github.ref_name }}
      - name: Tests and screenshot check
        run: gradle :core:money:test :core:intake:test :core:domain:test :core:importer:test :core:database:testDebugUnitTest :app:testDebugUnitTest :core:design:testDebugUnitTest :core:design:verifyRoborazziDebug --no-daemon
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Signed release APK (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle :app:assembleRelease --no-daemon
          else
            echo "No signing secrets; skipping release build."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chitta-apks
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
